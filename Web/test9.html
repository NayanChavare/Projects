<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce</title>
</head>
<body>
    <script>
        let cart=["laptop","mobile","headphones"];
        function createorder(cart){
            console.log("Creating Order...")
            return new Promise((resolve,reject)=>{
                setTimeout(()=>{
                    if(cart.length>0){
                        resolve({orderId:"12345",amount:"50000"})
                    }else{
                        reject("Cart is empty")
                    }
                },5000)
            })
        }
        function makepayement(order){
            console.log("Initiating Payment...")
            return new Promise((resolve,reject)=>{
                setTimeout(()=>{
                    let network=true
                    if (order,network){
                        resolve({...order,paymentId:"98765"})
                    }else{
                        reject("Payment Failed")
                    }
                },3000)
            })
        }
        function updateinventory(order){
            console.log("Updating Inventory...")
            return new Promise((resolve,reject)=>{
                setTimeout(()=>{
                    let inventory=true
                    if(inventory){
                        resolve({...order,inventoryUpdated:true})
                    }else{
                        reject("Inventory Update Failed")
                    }
                },2000)
            })
        }
        function orderstatus(order){
            console.log("Sending Order Status...")
            return new Promise((resolve,reject)=>{
                setTimeout(()=>{
                    let status=true
                    if(status){
                        resolve({...order,status:"Order Completed"})
                    }else{
                        reject("Order Cancelled")
                    }
                },2000)
            })
        }
        // createorder(cart).then(order=>{

        //     return makepayement(order)
        // }).then(order=>{

        //     return updateinventory(order)
        // }).then(order=>{
        //     console.log("Inventory Updated:", order)
        //     return orderstatus(order)
        // }).then(order=>{
        //     console.log("Order Status:", order)
        // }).catch(error=>{
        //     console.error("Error:", error)
        // }).finally(()=>{
        //     console.log("Process Completed")
        // })
        async function ecam() {
            try {
            let order=await createorder(cart)
            console.log("Order Created:", order)
            let payment=await makepayement(order)
            console.log("Payment Made:", payment)
            let inventory=await updateinventory(payment)
            console.log("Inventory Updated:", inventory)
            let status=await orderstatus(inventory)
            console.log("Order Status:", status)
            } catch (error) {
                console.error("Error:", error)
            } finally {
                console.log("Process Completed")
            }
        }
        
    </script>
</body>
</html>
