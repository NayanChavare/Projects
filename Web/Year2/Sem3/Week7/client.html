<script>
  socket = io('ws://localhost:3000/',{
    "transports": ['websocket']
  });
  socket.emit('two', 'Hello from client');
  socket.on('one', (data) => {
    console.log(data);
  });
  socket.on('join',(data) => {
    console.log(data);
  })
  socket.on('announcement',(data) => {
    console.log(data);
  })
</script>
