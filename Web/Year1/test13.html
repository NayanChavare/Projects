<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currying</title>
</head>
<body>
    <script>
        function add(a,b,c){
            return a+b+c;
        }
        function add(a){
            return function(b){
                return function(c){
                    return a+b+c;
                }
            }
        }
        console.log(add(10)(20)(30));

        function multi(a){
            return function(b){
                return function(c){
                    return a*b*c;
                }
            }
        }
        console.log(multi(10)(20)(30));
    </script>
</body>
</html>
