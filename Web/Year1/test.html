<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            width: 200px;
            height: 200px;
            background-color: rgb(243, 8, 157);
            color: rgb(13, 239, 70);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div>HELLO WORLD</div>
    <button id="add">Add</button>
    <button id="remove">Remove</button>
    <script>
        let box = document.querySelector('div');
        let btn1 = document.querySelector('#add');
        let btn2 = document.querySelector('#remove');
        function addStyle() {
            box.classList.add('container');
        }
        function removeStyle() {
            box.classList.remove('container');
        }
        btn1.addEventListener('click', addStyle);
        btn2.addEventListener('click', removeStyle);
    </script>
</body>
</html>
