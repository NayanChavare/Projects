<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laptop</title>
</head>
<body>
    <script>
        let laptop=["CPU","RAM","SSD"];
        function skeleton(laptop){
            let skeleton=["Frame","Screen","Keyboard"];
            console.log("Assembling Skeleton...")
            return new Promise((resolve,reject)=>{
                setTimeout(()=>{
                    if (laptop.length>0){
                        resolve({skeleton})
                    }else{
                        reject("Skeleton Assembly Failed")
                    }
                },3000)
            })
        }
        function hardware(skeleton){
            console.log("Installing Hardware...")
            return new Promise((resolve,reject)=>{
                setTimeout(()=>{
                    if (skeleton.skeleton.length>0){
                        resolve("Hardware Installation Complete")
                    }else{
                        reject("Hardware Installation Failed")
                    }
                },3000)
            })
        }
        function software(hardware){
            console.log("Installing Software...")
            return new Promise((resolve,reject)=>{
                setTimeout(()=>{
                    let os=true
                    if (hardware,os){
                        resolve("Software Installation Complete")
                    }else{
                        reject("Software Installation Failed")
                    }
                },3000)
            })
        }
        async function buildlaptop(){
            try{
                const skeleton=await skeleton(laptop);
                console.log(skeleton)
                const hardware=await hardware(skeleton);
                console.log(hardware)
                const software=await software(hardware);
                console.log(software)
            }catch(error){
                console.error(error)
            }
        }
        buildlaptop()
    </script>
</body>
</html>
