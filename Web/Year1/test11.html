<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #main{
            display: flex;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <div id="main">

    </div>
    <script>
        async function fetchData() {
            let res= await fetch("https://dummyjson.com/products")
            let data= await res.json()
            data.products.forEach(element => {
                let div=document.createElement("div")
                let main=document.getElementById("main")
                div.innerHTML=`<h1>${element.title}</h1><p>${element.description}</p><img src="${element.thumbnail}" alt="${element.title}">`
                main.appendChild(div)
                div.style.width="300px"
                div.style.height="auto"
                div.style.border="1px solid black"
                div.style.margin="10px"
                div.style.padding="10px"
                div.style.textAlign="center"
            });
        }
        async function fetchData2() {
            let res= await fetch("https://dummyjson.com/posts")
            let data= await res.json()
            data.posts.forEach(element => {
                let div=document.createElement("div")
                let main=document.getElementById("main")
                div.innerHTML=`<h1>${element.title}</h1><p>${element.body}</p>`
                main.appendChild(div)
                div.style.width="300px"
                div.style.height="auto"
                div.style.border="1px solid black"
                div.style.margin="10px"
                div.style.padding="10px"
                div.style.textAlign="center"
            });
        }
        async function fetchData3() {
            let res= await fetch("https://dummyjson.com/users")
            let data= await res.json()
            data.users.forEach(element => {
                let div=document.createElement("div")
                let main=document.getElementById("main")
                div.innerHTML=`<h1>${element.firstName} ${element.lastName}</h1>`
                main.appendChild(div)
                div.style.width="300px"
                div.style.height="100px"
                div.style.border="1px solid black"
                div.style.margin="10px"
                div.style.padding="10px"
                div.style.textAlign="center"
            });
        }
        async function fetchdata4() {
            let res = await fetch("https://dummyjson.com/quotes")
            let data = await res.json()
            data.quotes.forEach(element => {
                let div = document.createElement("div")
                let main = document.getElementById("main")
                div.innerHTML = `<h1>${element.author}</h1><p>${element.quote}</p>`
                main.appendChild(div)
                div.style.width = "300px"
                div.style.height = "auto"
                div.style.border = "1px solid black"
                div.style.margin = "10px"
                div.style.padding = "10px"
                div.style.textAlign = "center"
            });
        }
        fetchData3()
        fetchData2()
        fetchData()
        fetchdata4()
    </script>
</body>
</html>
