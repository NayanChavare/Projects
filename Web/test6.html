<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        let cart=["shirt","pants","shoes","hat","watch"];

        function createorder(cart,callback){
            console.log("creating order : ",cart);
            setTimeout(()=>{
                let orderid=12345;
                callback(orderid);
            },5000);
        }
        function makepayment(orderid,callback){
            console.log("making payment for order id : ",orderid);
            setTimeout(()=>{
                let ui=10-1;
                callback(ui);
            },7000);
        }
        function updateinventory(ui,callback){
            console.log("Remaning products: ",ui);
            setTimeout(()=>{
                let message="success";
                callback(message);
            },3000);
        }
        function orderstatus(message){
            console.log("order status : ",message);
        }

        createorder(cart,function(orderid){
            makepayment(orderid,function(ui){
                updateinventory(ui,function(message){
                    orderstatus(message);
                })
            })
        })
    
    // callback hell or pyramid of doom
    // Difficulty in error handling
    // code becomes complex and hard to maintain
    // inversion of control
    </script>

</body>
</html>
